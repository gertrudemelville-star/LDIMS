<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | LDIMS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet"
          href="../assets/css/style.css">

</head>

<body>

    <!-- ===========================
         NAVBAR
    ============================ -->

    <div id="navbar"></div>

    <!-- ===========================
         PAGE LAYOUT
    ============================ -->

    <div class="ldims-layout">

        <!-- Sidebar -->

        <aside id="sidebar"></aside>

        <!-- Main Content -->

        <main class="ldims-content">

            <!-- PAGE HEADER -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="page-title mb-1">
                        My Profile
                    </h2>

                    <p class="text-muted mb-0">

                        View your personal and organizational information.

                    </p>

                </div>

            </div>

            <!-- PROFILE HEADER -->

            <div class="profile-header">

                <div class="profile-photo">

                    <img
                        id="profilePhoto"
                        src="../assets/images/profile-default.png"
                        alt="Employee Photo">

                </div>

                <div class="profile-summary">

                    <h3 id="fullName">

                        Loading...

                    </h3>

                    <p
                        id="employeePosition"
                        class="mb-1 text-muted">

                        —

                    </p>

                    <span
                        class="badge bg-success"
                        id="employmentStatus">

                        Active

                    </span>

                </div>

            </div>

            <!-- EMPLOYEE INFORMATION -->

            <div class="profile-card">

                <h5 class="profile-section-title">

                    Employee Information

                </h5>

                <div class="profile-grid">

                    <div class="profile-field">

                        <label>Employee ID</label>

                        <div
                            class="profile-value readonly-field"
                            id="employeeID"></div>

                    </div>

                    <div class="profile-field">

                        <label>Email Address</label>

                        <div
                            class="profile-value readonly-field"
                            id="email"></div>

                    </div>

                    <div class="profile-field">

                        <label>Contact Number</label>

                        <div
                            class="profile-value readonly-field"
                            id="contactNumber"></div>

                    </div>

                    <div class="profile-field">

                        <label>Civil Status</label>

                        <div
                            class="profile-value readonly-field"
                            id="civilStatus"></div>

                    </div>

                </div>

            </div>

            <!-- ORGANIZATIONAL INFORMATION -->

            <div class="profile-card">

                <h5 class="profile-section-title">

                    Organizational Information

                </h5>

                <div class="profile-grid">

                    <div class="profile-field">

                        <label>Position</label>

                        <div
                            class="profile-value readonly-field"
                            id="position"></div>

                    </div>

                    <div class="profile-field">

                        <label>Division</label>

                        <div
                            class="profile-value readonly-field"
                            id="division"></div>

                    </div>

                    <div class="profile-field">

                        <label>Section</label>

                        <div
                            class="profile-value readonly-field"
                            id="section"></div>

                    </div>

                    <div class="profile-field">

                        <label>Salary Grade</label>

                        <div
                            class="profile-value readonly-field"
                            id="salaryGrade"></div>

                    </div>

                    <div class="profile-field">

                        <label>Supervisor</label>

                        <div
                            class="profile-value readonly-field"
                            id="supervisor"></div>

                    </div>

                </div>

            </div>

            <!-- EMPLOYMENT -->

            <div class="profile-card">

                <h5 class="profile-section-title">

                    Employment Information

                </h5>

                <div class="profile-grid">

                    <div class="profile-field">

                        <label>Appointment Date</label>

                        <div
                            class="profile-value readonly-field"
                            id="appointmentDate"></div>

                    </div>

                    <div class="profile-field">

                        <label>Years in Service</label>

                        <div
                            class="profile-value readonly-field"
                            id="yearsInService"></div>

                    </div>

                </div>

            </div>

            <!-- LEARNING -->

            <div class="profile-card">

                <h5 class="profile-section-title">

                    Learning Information

                </h5>

                <div class="profile-grid">

                    <div class="profile-field">

                        <label>Latest Training</label>

                        <div
                            class="profile-value readonly-field"
                            id="latestTraining"></div>

                    </div>

                    <div class="profile-field">

                        <label>Completed Learning Hours</label>

                        <div
                            class="profile-value readonly-field"
                            id="learningHours"></div>

                    </div>

                    <div class="profile-field">

                        <label>Total Certificates</label>

                        <div
                            class="profile-value readonly-field"
                            id="certificateCount"></div>

                    </div>

                </div>

            </div>

            <!-- ACTIONS -->

            <div class="profile-actions">

                <button
                    class="btn btn-primary"
                    id="btnEditProfile">

                    Edit Profile

                </button>

                <button
                    class="btn btn-outline-primary"
                    id="btnRequestUpdate">

                    Request Organizational Update

                </button>

            </div>

        </main>

    </div>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Core Scripts -->

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/session.js"></script>
    <script src="../assets/js/utils.js"></script>

    <!-- Shared Components -->

    <script src="../assets/js/components/loader.js"></script>

    <!-- Page Script -->

    <script src="../assets/js/pages/profile.js"></script>

</body>

</html>
