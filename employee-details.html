<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Details | LDIMS</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Global CSS -->

    <link rel="stylesheet"
          href="assets/css/style.css">

</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img src="assets/images/Logo.png"
                 class="sidebar-logo"
                 alt="NBI Logo">

            <h4>LDIMS</h4>

        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="profile.html">
                    <i class="bi bi-person-circle"></i>
                    My Profile
                </a>
            </li>

            <li>
                <a href="employee.html" class="active">
                    <i class="bi bi-people-fill"></i>
                    Employees
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <!-- Header -->

        <div class="topbar">

            <div>

                <h3>Employee Details</h3>

                <small>
                    View complete employee information.
                </small>

            </div>

            <div>

                <button
                    class="btn btn-outline-primary"
                    id="btnBack">

                    <i class="bi bi-arrow-left"></i>

                    Back

                </button>

                <button
                    class="btn btn-primary"
                    id="btnEdit">

                    <i class="bi bi-pencil-square"></i>

                    Edit Employee

                </button>

            </div>

        </div>

        <!-- Employee Header -->

        <div class="profile-header">

            <div class="profile-photo">

                <img
                    id="profilePhoto"
                    src="assets/images/profile-default.png"
                    alt="Employee Photo">

            </div>

            <div class="profile-summary">

                <h3 id="fullName">
                    Loading...
                </h3>

                <p id="employeePosition">
                    -
                </p>

                <span
                    id="employmentStatus"
                    class="badge bg-success">

                    Active

                </span>

            </div>

        </div>

        <!-- Personal Information -->

        <div class="profile-card">

            <h5 class="profile-section-title">

                Personal Information

            </h5>

            <div class="profile-grid">

                <div class="profile-field">

                    <label>Employee ID</label>

                    <div
                        id="employeeID"
                        class="profile-value">
                    </div>

                </div>

                <div class="profile-field">

                    <label>Email</label>

                    <div
                        id="email"
                        class="profile-value">
                    </div>

                </div>

                <div class="profile-field">

                    <label>Contact Number</label>

                    <div
                        id="contactNumber"
                        class="profile-value">
                    </div>

                </div>

                <div class="profile-field">

                    <label>Civil Status</label>

                    <div
                        id="civilStatus"
                        class="profile-value">
                    </div>

                </div>

            </div>

        </div>

        <!-- Organization -->

        <div class="profile-card">

            <h5 class="profile-section-title">

                Organizational Information

            </h5>

            <div class="profile-grid">

                <div class="profile-field">

                    <label>Position</label>

                    <div id="position"
                         class="profile-value"></div>

                </div>

                <div class="profile-field">

                    <label>Division</label>

                    <div id="division"
                         class="profile-value"></div>

                </div>

                <div class="profile-field">

                    <label>Section</label>

                    <div id="section"
                         class="profile-value"></div>

                </div>

                <div class="profile-field">

                    <label>Supervisor</label>

                    <div id="supervisor"
                         class="profile-value"></div>

                </div>

            </div>

        </div>

        <!-- Employment -->

        <div class="profile-card">

            <h5 class="profile-section-title">

                Employment Information

            </h5>

            <div class="profile-grid">

                <div class="profile-field">

                    <label>Appointment Date</label>

                    <div id="appointmentDate"
                         class="profile-value"></div>

                </div>

                <div class="profile-field">

                    <label>Years in Service</label>

                    <div id="yearsInService"
                         class="profile-value"></div>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/session.js"></script>

<script src="assets/js/pages/employee-details.js"></script>

</body>

</html>
